<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h2>dom create elemt</h2>
    <button onclick="additem()">add item</button>
    <ul id="list"></ul>
</body>
<script>
    function additem(){

    
    let li=document.createElement("li")

    li.innerText="new list added"
    li.className="item"
    document.getElementById("list").appendChild(li);
    }
</script>
