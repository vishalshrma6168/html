<script>
    let mypromises= new Promise(function(resolve,reject){
        let sucess=false
        if (sucess){
            resolve("task completed")
        }else{
            reject("task failed")
        }
    })


    mypromises
    .then(function(result){
        console.log(result)
    })
    .catch(function(error){
        console.log(error)
    })
    .finally(function(){
        console.log("task finished")
    })

    })
